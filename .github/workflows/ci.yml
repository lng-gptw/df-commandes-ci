name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # Versions: https://github.com/actions/checkout/releases

      - name: Set up Node.js
        uses: actions/setup-node@v4 # Versions: https://github.com/actions/setup-node/releases
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Test
        run: npm test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4 # Versions: https://github.com/actions/checkout/releases
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar xz -C /usr/local/bin gitleaks

      - name: Scan secrets
        run: gitleaks git -v --no-banner --redact .
